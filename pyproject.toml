[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viewer4d"
version = "0.1.0"
authors = [
  { name = "Chia-Hao Lee" },
]
description = "Fast 4D-STEM browser with PyTorch GPU acceleration. Forked from py4D-browser (Steven Zeltmann, LBL)."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
  "h5py",
  "numpy >= 1.21",
  "matplotlib >= 3.4",
  "platformdirs",
  "PyQt5 >= 5.15",
  "pyqtgraph >= 0.13",
  "sigfig",
  "tqdm",
  "scikit-image",
  "rosettasciio[all]",
  "tifffile",
]

[project.optional-dependencies]
# GPU acceleration for tcBF / acBF / iCOM (strongly recommended)
torch = ["torch"]
full  = ["viewer4d[torch]"]

[project.scripts]
4dviewer = "viewer4d.runGUI:launch"

[project.entry-points."viewer4d.plugins"]
calibration = "viewer4d_plugin.calibration_plugin"
tcbf        = "viewer4d_plugin.tcBF_plugin"
acbf        = "viewer4d_plugin.acBF_plugin"
ptyrad      = "viewer4d_plugin.ptyrad_plugin"

[project.urls]
"Homepage"    = "https://github.com/chiahao3/py4D-browser"
"Bug Tracker" = "https://github.com/chiahao3/py4D-browser/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
viewer4d = ["*.png"]
